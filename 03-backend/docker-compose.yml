services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: manabi
      POSTGRES_PASSWORD: manabi
      POSTGRES_DB: manabi_prep
    ports:
      - "5432:5432"
    volumes:
      - manabi_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U manabi -d manabi_prep"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://manabi:manabi@postgres:5432/manabi_prep
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && python -m app.services.seeder && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  manabi_pgdata:
